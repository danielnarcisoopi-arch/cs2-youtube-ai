name: CS2 market Shorts

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Lisbon wall-clock time shifts by one hour at DST changes.
    - cron: '0 8,12,16,20 * * *'

concurrency:
  group: cs2-market-shorts-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARKET_CURRENCY: EUR
      UPLOAD_ENABLED: 'true'
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_NOTIFY_SUBSCRIBERS: 'false'
      EDGE_TTS_VOICE: en-US-GuyNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install project package
        run: python -m pip install -e .
      - name: Check required publishing secret
        run: test -n "$YOUTUBE_TOKEN_JSON" || (echo 'Missing GitHub Actions secret YOUTUBE_TOKEN_JSON' >&2; exit 1)
      - name: Generate Short and publish
        run: python -m cs2_shorts
      - name: Keep market history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update CS2 market snapshots'
            git push
          fi
      - name: Save generated media and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-short-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
          if-no-files-found: ignore
          retention-days: 14
