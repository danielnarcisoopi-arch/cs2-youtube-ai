name: CS2 Skin Stories (AI)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Publish this video to YouTube (false = preview artifact only)
        type: boolean
        default: false
      format:
        description: Story format (auto rotates all available formats)
        type: choice
        default: auto
        options: [auto, budget, duel, loadout, wear, premium_budget, popular, watchlist]
  schedule:
    # UTC: Lisbon = these times in winter; one hour later in summer.
    - cron: '0 10,15,19 * * *'

concurrency:
  group: cs2-skin-stories
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  skin-story:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MARKET_CURRENCY: USD
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EDITORIAL_AI_MODEL: ${{ vars.EDITORIAL_AI_MODEL || 'gpt-4.1-mini' }}
      UPLOAD_ENABLED: ${{ github.event_name == 'schedule' || inputs.upload }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_NOTIFY_SUBSCRIBERS: 'false'
      EDGE_TTS_VOICE: en-US-AriaNeural
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      STORY_FORMAT: ${{ inputs.format || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check configuration before spending on generation
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo '::error::Add repository secret OPENAI_API_KEY for AI scripts.'; exit 1; }
          if [ "$UPLOAD_ENABLED" = 'true' ]; then
            test -n "$YOUTUBE_TOKEN_JSON" || { echo '::error::Missing YOUTUBE_TOKEN_JSON'; exit 1; }
          fi
      - name: Install renderer and project
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Test editorial rules
        run: python -m unittest discover -s tests -p 'test_editorial.py' -v
      - name: Restore durable anti-repeat history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/editorial_history.py restore
      - name: Download local neural fallback voice
        run: python -m piper.download_voices en_US-libritts_r-medium --data-dir data/voices
      - name: Generate a fresh story and optionally publish
        run: python -m cs2_shorts.editorial --format "$STORY_FORMAT"
      - name: Save durable anti-repeat history
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/editorial_history.py save
      - name: Keep preview video and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-skin-story-${{ github.run_id }}
          path: |
            output/editorial-*.mp4
            output/editorial-*.json
            data/editorial-history.json
          if-no-files-found: ignore
          retention-days: 30
