name: Skinshotter capture proof of concept

on:
  workflow_dispatch:
    inputs:
      skin_url:
        description: Skinshotter page to capture
        required: true
        default: https://skinshotter.com/rifles/awp/printstream
        type: string

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and Vulkan software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvulkan1 mesa-vulkan-drivers
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright>=1.59,<2'
          python -m playwright install --with-deps chromium
      - name: Capture Skinshotter in vertical format
        env:
          SKINSHOTTER_URL: ${{ inputs.skin_url }}
        run: >-
          python scripts/skinshotter_poc.py
          --url "$SKINSHOTTER_URL"
          --seconds 10
          --output output/skinshotter-poc
      - name: Upload capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skinshotter-poc-${{ github.run_id }}
          path: output/skinshotter-poc/
          if-no-files-found: warn
          retention-days: 14
