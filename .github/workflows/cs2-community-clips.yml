name: CS2 Community Clips Shorts

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload this manually started test to YouTube
        required: false
        default: false
        type: boolean
  schedule:
    # Four posts per day, offset from the market series (UTC; Lisbon shifts with DST).
    - cron: '25 9,13,17,21 * * *'

concurrency:
  group: cs2-community-clips-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPLOAD_ENABLED: ${{ github.event_name == 'schedule' || inputs.upload }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_PRIVACY_STATUS: public
      YOUTUBE_NOTIFY_SUBSCRIBERS: 'false'
      EDGE_TTS_VOICE: en-US-AriaNeural
      EDGE_TTS_RATE: '+0%'
      EDGE_TTS_PITCH: '+0Hz'
      CS2_CLIPS_DATASET_ID: nyuuzyou/cs2-highlights
      CS2_CLIP_MAX_BYTES: '230686720'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install project package
        run: python -m pip install -e .
      - name: Run automated tests
        run: python -m pytest -q
      - name: Download neural voice fallback
        run: python -m piper.download_voices en_US-libritts_r-medium --data-dir data/voices
      - name: Check YouTube secret before scheduled upload
        if: env.UPLOAD_ENABLED == 'true'
        run: test -n "$YOUTUBE_TOKEN_JSON" || (echo 'Missing GitHub Actions secret YOUTUBE_TOKEN_JSON' >&2; exit 1)
      - name: Run automated clip Short
        run: python -m cs2_shorts.clips
      - name: Save clip history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/clips-history.json ]; then
            git add data/clips-history.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore: update CS2 community clip history'
              branch="${GITHUB_REF_NAME}"
              git fetch origin "$branch"
              if git rebase "origin/$branch"; then
                git push origin "HEAD:$branch" || echo '::warning::Could not save community clip history.'
              else
                git rebase --abort || true
                echo '::warning::Could not rebase community clip history.'
              fi
            fi
          fi
      - name: Save generated clip Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-community-clip-${{ github.run_id }}
          path: |
            output/*-cs2-clip-*.mp4
            output/*-cs2-clip-*.json
          if-no-files-found: ignore
          retention-days: 14
